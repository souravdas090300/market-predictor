[phases.build]
cmds = ["pip install -r requirements.txt"]

[phases.start]
cmd = "python scripts/startup.py && uvicorn app.api:app --host 0.0.0.0 --port $PORT --workers 1"

[static]
# Create necessary directories
dirs = ["data", "logs", "models", "static"]

[environment]
PYTHONPATH = "/app"
PYTHONUNBUFFERED = "1"
CORS_ORIGINS = "https://market-predictor-eta.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
ENV = "production"