[phases.build]
cmds = ["cd market-predictor && pip install -r requirements.txt"]

[phases.start]
cmd = "./start.sh"

[static]
# Create necessary directories
dirs = ["market-predictor/data", "market-predictor/logs", "market-predictor/models", "market-predictor/static"]

[environment]
PYTHONPATH = "/app/market-predictor"
PYTHONUNBUFFERED = "1"