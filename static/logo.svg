<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="candleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10B981;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- ICON ONLY (Square, 256x256) -->
  <!-- Rounded square background -->
  <rect x="16" y="16" width="224" height="224" rx="40" ry="40" fill="url(#logoGradient)"/>
  
  <!-- Candlestick Chart (3 candles) -->
  <g transform="translate(0, 0)">
    <!-- Candle 1 (bearish - down) -->
    <line x1="60" y1="140" x2="60" y2="180" stroke="#F9FAFB" stroke-width="8" stroke-linecap="round"/>
    <rect x="48" y="160" width="24" height="30" fill="#F9FAFB" rx="2"/>
    
    <!-- Candle 2 (bullish - up) -->
    <line x1="128" y1="100" x2="128" y2="190" stroke="#F9FAFB" stroke-width="8" stroke-linecap="round"/>
    <rect x="116" y="130" width="24" height="60" fill="url(#candleGradient)" rx="2"/>
    
    <!-- Candle 3 (bullish - up) -->
    <line x1="196" y1="80" x2="196" y2="180" stroke="#F9FAFB" stroke-width="8" stroke-linecap="round"/>
    <rect x="184" y="100" width="24" height="80" fill="url(#candleGradient)" rx="2"/>
    
    <!-- Trend line connecting tops (uptrend) -->
    <path d="M 60 135 Q 128 95 196 75" stroke="#F9FAFB" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
