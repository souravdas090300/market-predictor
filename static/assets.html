<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Predictor – Asset Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            /* Light mode colors */
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        [data-theme="dark"] {
            /* Dark mode colors */
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: white;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .theme-toggle {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .theme-toggle:hover {
            background: var(--border-color);
        }
        
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 14px;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .category-tab {
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .category-tab:hover {
            background: var(--border-color);
        }
        
        .category-tab.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }
        
        .assets-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        
        .assets-table th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            text-transform: uppercase;
        }
        
        .assets-table td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .assets-table tr:hover {
            background: var(--bg-secondary);
            cursor: pointer;
        }
        
        .asset-symbol {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-primary);
        }
        
        .asset-name {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .asset-class {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .asset-class.stock { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); }
        .asset-class.crypto { background: rgba(251, 191, 36, 0.1); color: #fbbf24; }
        .asset-class.forex { background: rgba(139, 92, 246, 0.1); color: var(--accent-purple); }
        .asset-class.commodity { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); }
        
        .price {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 16px;
        }
        
        .change {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 14px;
        }
        
        .change.positive { color: var(--accent-green); }
        .change.negative { color: var(--accent-red); }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: var(--accent-red);
        }
        
        /* Top Movers Section */
        .top-movers-section {
            margin-bottom: 24px;
            padding: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        .top-movers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }
        
        .mover-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }
        
        .mover-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .mover-card-title {
            font-weight: 600;
            font-size: 14px;
        }
        
        .mover-card-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        .mover-card-label.gainer { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); }
        .mover-card-label.loser { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); }
        
        .mover-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .mover-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .mover-item:hover {
            background: var(--border-color);
        }
        
        .mover-symbol {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .mover-change {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .mover-change.positive { color: var(--accent-green); }
        .mover-change.negative { color: var(--accent-red); }
        
        /* Asset Detail Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-md);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: 700;
        }
        
        .close-btn {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .price-display {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .current-price {
            font-size: 36px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .price-change {
            font-size: 18px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .price-change.positive { color: var(--accent-green); }
        .price-change.negative { color: var(--accent-red); }
        
        .price-high-low {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .timeframe-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .timeframe-tab {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .timeframe-tab:hover {
            background: var(--border-color);
        }
        
        .timeframe-tab.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }
        
        .chart-container {
            height: 400px;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }
        
        .chart-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }
            
            .assets-table {
                font-size: 12px;
            }
            
            .assets-table th,
            .assets-table td {
                padding: 12px 8px;
            }
            
            .top-movers-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-title">
                <div class="logo-icon">MP</div>
                <div>
                    <h1>Asset Library</h1>
                    <p>Real-time market data and predictions</p>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle">🌙 Dark Mode</button>
        </header>
        
        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="Search assets by symbol or name..." />
            <button id="clearSearch" style="padding: 12px 16px; background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px; cursor: pointer; font-size: 14px; display: none;">Clear</button>
        </div>
        
        <div class="category-tabs" id="categoryTabs">
            <button class="category-tab active" data-category="all">All Assets</button>
            <button class="category-tab" data-category="stock">Stocks</button>
            <button class="category-tab" data-category="crypto">Crypto</button>
            <button class="category-tab" data-category="forex">Forex</button>
            <button class="category-tab" data-category="commodity">Commodities</button>
        </div>
        
        <!-- Top Movers Section -->
        <div class="top-movers-section" id="topMoversSection">
            <h2 class="section-title">Top Movers of the Day</h2>
            <div class="top-movers-grid" id="topMoversGrid">
                <div class="loading">Loading top movers...</div>
            </div>
        </div>
        
        <!-- Assets Table -->
        <table class="assets-table">
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Price</th>
                    <th>24h Change</th>
                    <th>Volume</th>
                    <th>Market Cap</th>
                </tr>
            </thead>
            <tbody id="assetsTableBody">
                <tr>
                    <td colspan="7" class="loading">Loading assets...</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <!-- Asset Detail Modal -->
    <div class="modal-overlay" id="assetModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title" id="modalTitle">BTC-USD</h2>
                    <p id="modalName" style="color: var(--text-secondary);">Bitcoin</p>
                </div>
                <button class="close-btn" id="closeModal">Close</button>
            </div>
            
            <div class="price-display">
                <span class="current-price" id="modalPrice">$84,693.20</span>
                <span class="price-change positive" id="modalChange">+$1,209.59 (1.37%)</span>
            </div>
            
            <div class="price-high-low">
                <span>High: <span id="modalHigh">$85,020.70</span></span>
                <span>Low: <span id="modalLow">$83,328.80</span></span>
            </div>
            
            <div class="timeframe-tabs" id="timeframeTabs">
                <button class="timeframe-tab active" data-timeframe="24h">24H</button>
                <button class="timeframe-tab" data-timeframe="1w">1W</button>
                <button class="timeframe-tab" data-timeframe="1m">1M</button>
                <button class="timeframe-tab" data-timeframe="6m">6M</button>
                <button class="timeframe-tab" data-timeframe="1y">1Y</button>
                <button class="timeframe-tab" data-timeframe="5y">5Y</button>
                <button class="timeframe-tab" data-timeframe="all">ALL</button>
            </div>
            
            <div class="chart-container" id="chartContainer">
                <div class="chart-placeholder">Loading chart...</div>
            </div>
        </div>
    </div>
    
    <script>
        let allAssets = [];
        let currentCategory = 'all';
        let searchQuery = '';
        let currentAsset = null;
        let currentTimeframe = '24h';
        let refreshInterval = null;
        
        const $ = (id) => document.getElementById(id);
        
        function fmt(n, d = 2) {
            if (n == null || Number.isNaN(n)) return '—';
            return Number(n).toLocaleString(undefined, { maximumFractionDigits: d });
        }
        
        function fmtLargeNumber(n) {
            if (n == null || Number.isNaN(n)) return '—';
            if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
            if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
            return fmt(n, 2);
        }
        
        function pct(n) {
            if (n == null) return '—';
            const s = (n * 100).toFixed(2);
            return (n >= 0 ? '+' : '') + s + '%';
        }
        
        // Theme toggle
        function initTheme() {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const savedTheme = localStorage.getItem('theme');
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeButton(theme);
        }
        
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButton(newTheme);
        }
        
        function updateThemeButton(theme) {
            $('themeToggle').textContent = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
        }
        
        // Load assets
        async function loadAssets() {
            try {
                const response = await fetch('http://localhost:8000/api/v2/assets/list?category=' + currentCategory + '&limit=100');
                if (!response.ok) throw new Error('Failed to fetch assets');

                const data = await response.json();
                allAssets = data.assets || [];

                renderAssetsTable();
                loadTopMovers();
            } catch (error) {
                console.error('Error loading assets:', error);
                $('assetsTableBody').innerHTML = '<tr><td colspan="7" class="error">Failed to load assets</td></tr>';
            }
        }

        // Refresh live prices
        async function refreshPrices() {
            try {
                const response = await fetch('http://localhost:8000/api/v2/assets/list?category=' + currentCategory + '&limit=100');
                if (!response.ok) throw new Error('Failed to refresh prices');

                const data = await response.json();
                allAssets = data.assets || [];

                renderAssetsTable();
                loadTopMovers();
            } catch (error) {
                console.error('Error refreshing prices:', error);
            }
        }
        
        // Render assets table
        function renderAssetsTable() {
            const tbody = $('assetsTableBody');

            let filtered = allAssets;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(asset => asset.category === currentCategory);
            }

            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(asset =>
                    asset.symbol.toLowerCase().includes(query) ||
                    asset.name.toLowerCase().includes(query)
                );
            }

            // Show search results count
            const totalCount = allAssets.length;
            const categoryCount = currentCategory !== 'all' 
                ? allAssets.filter(a => a.category === currentCategory).length
                : totalCount;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="loading">No assets found matching "${searchQuery}"</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(asset => {
                // Use new API format
                const price = asset.current_price || 0;
                const change = asset.change_percent_24h || 0;
                const volume = asset.volume_24h || 0;
                const marketCap = asset.market_cap || 0;
                const changeClass = change >= 0 ? 'positive' : 'negative';
                const changeSign = change >= 0 ? '+' : '';

                // Highlight matching text
                const highlightMatch = (text, query) => {
                    if (!query) return text;
                    const regex = new RegExp(`(${query})`, 'gi');
                    return text.replace(regex, '<mark style="background: rgba(59, 130, 246, 0.3); padding: 0 2px; border-radius: 2px;">$1</mark>');
                };

                const highlightedSymbol = searchQuery ? highlightMatch(asset.symbol, searchQuery) : asset.symbol;
                const highlightedName = searchQuery ? highlightMatch(asset.name, searchQuery) : asset.name;

                return `
                    <tr onclick="openAssetModal('${asset.symbol}')" style="cursor: pointer;">
                        <td>
                            <div class="asset-symbol">${highlightedSymbol}</div>
                        </td>
                        <td>
                            <div class="asset-name">${highlightedName}</div>
                        </td>
                        <td>
                            <span class="asset-class ${asset.category}">${asset.category}</span>
                        </td>
                        <td>
                            <div class="price">${fmt(price, 4)}</div>
                        </td>
                        <td>
                            <div class="change ${changeClass}">${changeSign}${pct(change)}</div>
                        </td>
                        <td>
                            <div class="price">${volume ? fmtLargeNumber(volume) : '—'}</div>
                        </td>
                        <td>
                            <div class="price">${marketCap ? fmtLargeNumber(marketCap) : '—'}</div>
                        </td>
                    </tr>
                `;
            }).join('');
            
            // Update results count
            const tableElement = document.querySelector('.assets-table');
            const existingCount = tableElement.parentElement.querySelector('.results-count');
            if (existingCount) existingCount.remove();
            
            const countDiv = document.createElement('div');
            countDiv.className = 'results-count';
            countDiv.style.cssText = 'margin-bottom: 12px; font-size: 13px; color: var(--text-secondary);';
            countDiv.innerHTML = `Showing ${filtered.length} of ${categoryCount} assets ${searchQuery ? `matching "${searchQuery}"` : ''}`;
            tableElement.parentElement.insertBefore(countDiv, tableElement);
        }
        
        // Load top movers
        async function loadTopMovers() {
            try {
                // Get counts for each category
                const countsResponse = await fetch('http://localhost:8000/api/v2/assets/counts');
                if (!countsResponse.ok) throw new Error('Failed to fetch counts');

                const countsData = await countsResponse.json();

                // Get top gainers for current category
                const gainersResponse = await fetch('http://localhost:8000/api/v2/assets/list?category=' + currentCategory + '&sort_by=gainers&limit=5');
                if (!gainersResponse.ok) throw new Error('Failed to fetch gainers');

                const gainersData = await gainersResponse.json();

                // Get top losers for current category
                const losersResponse = await fetch('http://localhost:8000/api/v2/assets/list?category=' + currentCategory + '&sort_by=losers&limit=5');
                if (!losersResponse.ok) throw new Error('Failed to fetch losers');

                const losersData = await losersResponse.json();

                renderTopMovers({
                    counts: countsData,
                    gainers: gainersData.assets,
                    losers: losersData.assets
                });
            } catch (error) {
                console.error('Error loading top movers:', error);
                $('topMoversGrid').innerHTML = '<div class="error">Failed to load top movers</div>';
            }
        }
        
        // Render top movers
        function renderTopMovers(data) {
            const grid = $('topMoversGrid');

            if (!data) {
                grid.innerHTML = '<div class="loading">No data available</div>';
                return;
            }

            const { counts, gainers, losers } = data;

            // Show gainers and losers
            const gainersHtml = gainers && gainers.length > 0
                ? gainers.slice(0, 5).map(mover => `
                    <div class="mover-item" onclick="openAssetModal('${mover.symbol}')">
                        <span class="mover-symbol">${mover.symbol}</span>
                        <span class="mover-change positive">+${pct(mover.change_percent_24h)}</span>
                    </div>
                `).join('')
                : '<div class="loading">No gainers</div>';

            const losersHtml = losers && losers.length > 0
                ? losers.slice(0, 5).map(mover => `
                    <div class="mover-item" onclick="openAssetModal('${mover.symbol}')">
                        <span class="mover-symbol">${mover.symbol}</span>
                        <span class="mover-change negative">${pct(mover.change_percent_24h)}</span>
                    </div>
                `).join('')
                : '<div class="loading">No losers</div>';

            const html = `
                <div class="mover-card">
                    <div class="mover-card-header">
                        <span class="mover-card-title">Top Movers (${currentCategory.toUpperCase()})</span>
                    </div>
                    <div class="mover-list">
                        <div class="mover-card-label gainer">Top Gainers</div>
                        ${gainersHtml}
                        <div class="mover-card-label loser">Top Losers</div>
                        ${losersHtml}
                    </div>
                </div>
            `;

            grid.innerHTML = html;
        }
        
        // Open asset modal
        function openAssetModal(symbol) {
            currentAsset = symbol;
            
            const asset = allAssets.find(a => a.symbol === symbol);
            if (!asset) return;
            
            const quote = asset.quote;
            
            $('modalTitle').textContent = symbol;
            $('modalName').textContent = asset.name;
            $('modalPrice').textContent = quote ? `$${fmt(quote.price, 2)}` : 'Loading...';
            
            if (quote) {
                const change = quote.change_pct || 0;
                const changeClass = change >= 0 ? 'positive' : 'negative';
                const changeSign = change >= 0 ? '+' : '';
                $('modalChange').textContent = `${changeSign}$${fmt(quote.change, 2)} (${changeSign}${pct(change)})`;
                $('modalChange').className = `price-change ${changeClass}`;
                $('modalHigh').textContent = quote.day_high ? `$${fmt(quote.day_high, 2)}` : '—';
                $('modalLow').textContent = quote.day_low ? `$${fmt(quote.day_low, 2)}` : '—';
            }
            
            $('assetModal').classList.add('active');
            loadChart(symbol, currentTimeframe);
        }
        
        // Close modal
        function closeModal() {
            $('assetModal').classList.remove('active');
            currentAsset = null;
        }
        
        // Load chart (placeholder - would integrate with chart library)
        function loadChart(symbol, timeframe) {
            const container = $('chartContainer');
            container.innerHTML = `<div class="chart-placeholder">Loading ${symbol} chart for ${timeframe}...</div>`;
            
            // In production, this would load actual chart data
            setTimeout(() => {
                container.innerHTML = `
                    <div class="chart-placeholder">
                        <div style="text-align: center;">
                            <div style="font-size: 48px; margin-bottom: 16px;">📈</div>
                            <div>Chart for ${symbol} - ${timeframe.toUpperCase()}</div>
                            <div style="font-size: 12px; margin-top: 8px; color: var(--text-secondary);">
                                Chart integration would go here (e.g., TradingView, Chart.js)
                            </div>
                        </div>
                    </div>
                `;
            }, 500);
        }
        
        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadAssets();
            
            // Theme toggle
            $('themeToggle').addEventListener('click', toggleTheme);
            
            // Category tabs
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = tab.dataset.category;
                    renderAssetsTable();
                });
            });
            
            // Search
            $('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                $('clearSearch').style.display = searchQuery ? 'block' : 'none';
                renderAssetsTable();
            });
            
            // Clear search
            $('clearSearch').addEventListener('click', () => {
                searchQuery = '';
                $('searchInput').value = '';
                $('clearSearch').style.display = 'none';
                renderAssetsTable();
            });
            
            // Clear search on Escape key
            $('searchInput').addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchQuery = '';
                    $('searchInput').value = '';
                    $('clearSearch').style.display = 'none';
                    renderAssetsTable();
                }
            });
            
            // Close modal
            $('closeModal').addEventListener('click', closeModal);
            $('assetModal').addEventListener('click', (e) => {
                if (e.target === $('assetModal')) {
                    closeModal();
                }
            });
            
            // Timeframe tabs
            document.querySelectorAll('.timeframe-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.timeframe-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentTimeframe = tab.dataset.timeframe;
                    if (currentAsset) {
                        loadChart(currentAsset, currentTimeframe);
                    }
                });
            });
            
            // Auto-refresh prices every 15 seconds
            refreshInterval = setInterval(() => {
                refreshPrices();
            }, 15000);
            
            // Clean up interval on page unload
            window.addEventListener('beforeunload', () => {
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                }
            });
        });
    </script>
</body>
</html>
