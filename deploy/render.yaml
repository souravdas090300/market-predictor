services:
  - type: web
    name: market-predictor-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_AUTHENTICATION
        value: true
      - key: ENABLE_RATE_LIMITING
        value: true
